AWSTemplateFormatVersion: "2010-09-09"
Description: Blog publish notification - phase 1 (SNS SMS + email)

Parameters:
  PhoneNumber:
    Type: String
    Description: E.164 format, e.g. +15551234567

  EmailAddress:
    Type: String

Resources:
  NotifyTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: blog-publish-notifications

  SmsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref NotifyTopic
      Protocol: sms
      Endpoint: !Ref PhoneNumber

  EmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref NotifyTopic
      Protocol: email
      Endpoint: !Ref EmailAddress

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PublishToSns
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref NotifyTopic
        - PolicyName: ReadSharedSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:blog-notify/shared-secret-*

  NotifyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: blog-publish-notify
      Runtime: python3.14
      Handler: handler.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      Environment:
        Variables:
          TOPIC_ARN: !Ref NotifyTopic
          SECRET_ID: blog-notify/shared-secret
      Code: src/

  NotifyFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref NotifyFunction
      AuthType: NONE

  PublicInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NotifyFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  PublicInvokeViaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NotifyFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  FunctionUrl:
    Value: !GetAtt NotifyFunctionUrl.FunctionUrl
  TopicArn:
    Value: !Ref NotifyTopic